name: Tests

# Regression guard: run the Vitest suite (functional + accessibility +
# responsive-behaviour tests) on every push and pull request so new features
# can't silently break existing behaviour.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
