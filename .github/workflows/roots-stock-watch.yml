name: Roots stock watch

# Polls the watched Roots product every 30 minutes and texts when a wanted size
# comes back in stock. Runs here rather than on a laptop so it keeps checking
# overnight and while the machine is closed.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM, ALERT_TO_PHONE
# Optional:
#   ROOTS_WATCH_WEBHOOK  - JSON POST instead of / alongside SMS
#   ROOTS_WATCH_URL      - override the product page (defaults to the shirt)
#   ROOTS_WATCH_SIZES    - override the sizes (defaults to 3,5)
#
# Two things to know about GitHub's scheduler: cron fires late under load (a
# few minutes is normal, more at the top of the hour, which is why this runs at
# :07 and :37), and it stops scheduling entirely after 60 days without a push
# to the repo. If the alerts go quiet for weeks, check that first.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

# Never let a slow run overlap the next scheduled one.
concurrency:
  group: roots-stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Each run gets a fresh machine, so the "have we already texted about
      # this restock" state has to be carried between runs. The key is unique
      # per run (caches are immutable) and restore-keys picks up the newest
      # previous one.
      - name: Restore watch state
        uses: actions/cache@v4
        with:
          path: scripts/roots-stock-watch/.watch-state.json
          key: roots-watch-state-${{ github.run_id }}
          restore-keys: roots-watch-state-

      - name: Check stock
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_TO_PHONE: ${{ secrets.ALERT_TO_PHONE }}
          ROOTS_WATCH_WEBHOOK: ${{ secrets.ROOTS_WATCH_WEBHOOK }}
          ROOTS_WATCH_URL: ${{ vars.ROOTS_WATCH_URL }}
          ROOTS_WATCH_SIZES: ${{ vars.ROOTS_WATCH_SIZES }}
        run: |
          set +e
          node scripts/roots-stock-watch/index.mjs --once
          code=$?
          set -e
          # 10 (in stock) is a successful check, not a failed job — the alert
          # has already gone out by this point. 20 means the page couldn't be
          # read; the script alerts on its own after a few of those in a row,
          # so here it's only a warning.
          case "$code" in
            0|10) exit 0 ;;
            20) echo "::warning::Could not determine availability on this run" ; exit 0 ;;
            *) exit "$code" ;;
          esac
