[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_GOOGLE_CAL,VITE_TURNSTILE_SITE_KEY"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  publish = "build/client"

[functions]
  directory = "netlify/functions"

# .com is a domain alias for this site (.ca is primary); Netlify's automatic
# alias redirect hasn't been reliably kicking in, so force it explicitly.
[[redirects]]
  from = "https://goodwood159.com/*"
  to = "https://goodwood159.ca/:splat"
  status = 301
  force = true
